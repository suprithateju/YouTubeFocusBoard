<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Focus Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f1f5f9;
      box-sizing: border-box;
    }
    h2 { font-size: 14px; margin: 0 0 10px 0; color: #38bdf8; }
    .toggle-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; }
    .btn { width: 100%; background: #0284c7; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <h2>🎯 YouTube Focus Board</h2>
  <div class="toggle-row">
    <span>Hide Shorts</span>
    <input type="checkbox" id="chkShorts" checked>
  </div>
  <div class="toggle-row">
    <span>Hide Recommendations</span>
    <input type="checkbox" id="chkRecs" checked>
  </div>
  <div class="toggle-row">
    <span>Hide Comments</span>
    <input type="checkbox" id="chkComments" checked>
  </div>
  <button id="btnResetGate" class="btn">Reset Intent Gate</button>
  <script src="popup.js"></script>
</body>
</html>
